<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SwissGrid</title>
  <link rel="stylesheet" href="css/panel.css">
</head>
<body>
  <div class="panel">

    <div class="doc" id="docInfo">Connecting to Photoshop…</div>

    <nav class="tabs">
      <button class="tab active" data-tab="grid">Grid</button>
      <button class="tab" data-tab="type">Type sizes</button>
      <button class="tab" data-tab="doc">Document</button>
      <button class="tab" data-tab="presets">Presets</button>
    </nav>

    <div class="status" id="status"></div>

    <div class="pane" id="pane-grid">
    <section class="actions">
      <button id="btnApply" class="primary">Apply grid</button>
      <div class="row">
        <button id="btnBaseline" class="grow small" title="Adds the baseline grid that matches these measurements: one line per body leading, from the top of the first field to the bottom of the last.">+ Baseline</button>
        <button id="btnSavePreset" class="grow small">Save preset</button>
        <button id="btnClearInputs" class="grow small">Clear</button>
      </div>
      <div class="preview" id="preview"></div>
    </section>

    <section class="suggest" id="suggestBox">
      <div class="sg-head"><span class="section-title">Suggested grid</span><span id="sgCanvas" class="sg-canvas"></span></div>
      <div class="sg-main">
        <div class="sg-thumb"><svg id="sgPreview" width="74" height="96"></svg></div>
        <div class="sg-ctrls">
          <div class="sg-step"><span class="sg-lbl">Columns</span><button id="sgColMinus" class="sg-btn" title="Fewer columns">−</button><b id="sgCols">4</b><button id="sgColPlus" class="sg-btn" title="More columns">+</button></div>
          <div class="sg-step"><span class="sg-lbl">Rows</span><button id="sgRowMinus" class="sg-btn" title="Fewer rows">−</button><b id="sgRows">5</b><button id="sgRowPlus" class="sg-btn" title="More rows">+</button><button id="sgRowAuto" class="sg-auto" title="Let SwissGrid pick rows for the field shape">auto</button></div>
          <select id="sgShape" title="Shape of each field">
            <option value="square">Square fields</option>
            <option value="golden">Golden fields, tall</option>
            <option value="wide">Golden fields, wide</option>
            <option value="fibonacci">Fibonacci</option>
          </select>
          <div class="sg-density"><button id="sgLooser" class="small">◀ Looser</button><button id="sgDenser" class="small">Denser ▶</button></div>
        </div>
      </div>
      <div class="sg-spec" id="sgSpec"></div>
      <div class="row sg-actions">
        <button id="sgApply" class="grow sg-apply">Apply suggestion</button>
        <button id="sgUse" class="grow" title="Put these measurements in the fields below to fine-tune them">Edit in fields</button>
      </div>
    </section>
    <section>
      <div class="row">
        <input type="text" id="gridName" class="grow" placeholder="Grid name">
      </div>
      <div class="row">
        <input type="color" id="colorPicker" value="#00aeef" title="Pick a color">
        <input type="text" id="colorHex" value="#00AEEF" class="hex" spellcheck="false">
        <div class="swatches" id="quickSwatches"></div>
      </div>
      <div class="row">
        <label class="lbl" for="drawMode">Draw as</label>
        <select id="drawMode" class="grow">
          <option value="both">Guides + colored layer</option>
          <option value="layer">Colored layer only</option>
          <option value="guides">Guides only</option>
        </select>
        <select id="lineWidth" title="Line thickness">
          <option value="1">1 px</option>
          <option value="2">2 px</option>
          <option value="3">3 px</option>
          <option value="4">4 px</option>
        </select>
      </div>
      <div class="row">
        <label class="lbl" for="unit">Unit</label>
        <select id="unit">
          <option value="mm">mm</option>
          <option value="px">px</option>
          <option value="in">in</option>
          <option value="cm">cm</option>
          <option value="pt">pt</option>
          <option value="%">%</option>
        </select>
        <span class="hint">or type 75px, 12pt…</span>
      </div>
    </section>

    <section class="cols">
      <div class="col">
        <div class="col-title">Columns</div>
        <label class="field"><span>Left margin</span><input type="text" id="marginLeft"></label>
        <label class="field"><span>Right margin</span><input type="text" id="marginRight"></label>
        <label class="field"><span>Columns</span><input type="text" id="columns"></label>
        <label class="field"><span>Width</span><input type="text" id="columnWidth" placeholder="auto"></label>
        <label class="field"><span>Gutter</span><input type="text" id="columnGutter"></label>
        <label class="field"><span>Position</span>
          <select id="alignH"><option value="start">Left</option><option value="center">Center</option><option value="end">Right</option></select>
        </label>
        <label class="check"><input type="checkbox" id="midVertical"> Midpoint</label>
      </div>
      <div class="col">
        <div class="col-title">Rows</div>
        <label class="field"><span>Top margin</span><input type="text" id="marginTop"></label>
        <label class="field"><span>Bottom margin</span><input type="text" id="marginBottom"></label>
        <label class="field"><span>Rows</span><input type="text" id="rows"></label>
        <label class="field"><span>Height</span><input type="text" id="rowHeight" placeholder="auto"></label>
        <label class="field"><span>Gutter</span><input type="text" id="rowGutter"></label>
        <label class="field"><span>Position</span>
          <select id="alignV"><option value="start">Top</option><option value="center">Middle</option><option value="end">Bottom</option></select>
        </label>
        <label class="check"><input type="checkbox" id="midHorizontal"> Midpoint</label>
      </div>
    </section>

    </div>

    <div class="pane hidden" id="pane-type">
    <div class="typerec" id="typeRecBox">
      <div class="section-title">Type sizes for this grid</div>
      <div id="typeRec"></div>
    </div>
    </div>

    <div class="pane hidden" id="pane-doc">
    <section>
      <div class="section-title">On this document</div>
      <div id="appliedList" class="list"></div>
      <button id="btnClearAll" class="danger">Clear all grids</button>
    </section>
      <button id="btnDiag" class="link-btn" title="Copies panel size and Photoshop details for troubleshooting">Copy diagnostics</button>
    </div>

    <div class="pane hidden" id="pane-presets">
    <section>
      <div class="section-title">Presets</div>
      <div id="presetList" class="list"></div>
      <div class="row">
        <button id="btnExport" class="grow small">Export…</button>
        <button id="btnImport" class="grow small">Import…</button>
      </div>
    </section>
    </div>







  </div>

  <script src="js/grid.js"></script>
  <script src="js/typeRec.js"></script>
  <script src="js/suggest.js"></script>
  <script src="js/gridstore.js"></script>
  <script src="js/panel.js"></script>
  <script src="js/cepfix.js"></script>
  <script src="js/license.js"></script>
  <script src="js/license-config.js"></script>
</body>
</html>
